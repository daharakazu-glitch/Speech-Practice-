<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoFluent - English Practice</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (for JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Merriweather', serif; }
        /* Custom animations */
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 8s linear infinite; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 selection:bg-indigo-100 selection:text-indigo-800 pb-12">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icons (Lucide React Replacements) ---
        // CDN版で動作させるため、SVGコンポーネントとして定義し直しています
        const IconBase = ({ children, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>{children}</svg>
        );
        const Mic = (props) => <IconBase {...props}><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></IconBase>;
        const Play = (props) => <IconBase {...props}><polygon points="6 3 20 12 6 21 6 3"/></IconBase>;
        const Square = (props) => <IconBase {...props}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/></IconBase>;
        const RotateCcw = (props) => <IconBase {...props}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12"/><path d="M3 3v9h9"/></IconBase>;
        const Upload = (props) => <IconBase {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></IconBase>;
        const FileText = (props) => <IconBase {...props}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></IconBase>;
        const Award = (props) => <IconBase {...props}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></IconBase>;
        const Volume2 = (props) => <IconBase {...props}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></IconBase>;
        const ChevronRight = (props) => <IconBase {...props}><path d="m9 18 6-6-6-6"/></IconBase>;
        const X = (props) => <IconBase {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconBase>;
        const Check = (props) => <IconBase {...props}><path d="M20 6 9 17l-5-5"/></IconBase>;
        const Star = (props) => <IconBase {...props}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></IconBase>;
        const Settings = (props) => <IconBase {...props}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></IconBase>;

        // --- Utility: Scoring Logic ---
        const normalize = (str) => str.toLowerCase().replace(/[^\w\s]/gi, '').replace(/\s+/g, ' ').trim();

        const getLevenshteinDistance = (a, b) => {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            const matrix = [];
            for (let i = 0; i <= b.length; i++) matrix[i] = [i];
            for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1);
                    }
                }
            }
            return matrix[b.length][a.length];
        };

        const calculateDetailedScore = (original, spoken) => {
            const normOriginal = normalize(original);
            const normSpoken = normalize(spoken);

            if (!normOriginal) return { score: 0, matches: [] };
            if (!normSpoken) return { score: 0, matches: new Array(original.split(/\s+/).length).fill(false) };

            const originalWords = normOriginal.split(/\s+/);
            const spokenWords = normSpoken.split(/\s+/);
            
            const matches = originalWords.map(word => spokenWords.includes(word));
            const matchCount = matches.filter(Boolean).length;
            const matchRate = (matchCount / originalWords.length) * 100;

            const distance = getLevenshteinDistance(normOriginal, normSpoken);
            const maxLength = Math.max(normOriginal.length, normSpoken.length);
            const similarity = (1 - distance / maxLength) * 100;

            let rawScore = (matchRate * 0.7) + (similarity * 0.3);
            let finalScore = rawScore;
            if (matchRate > 80) finalScore += 10;
            if (matchRate > 50) finalScore += 5;

            finalScore = Math.min(100, Math.max(0, Math.floor(finalScore)));
            return { score: finalScore, matches };
        };

        // --- Component: Header ---
        const Header = () => (
            <header className="bg-white/80 backdrop-blur-md border-b border-indigo-100 sticky top-0 z-10">
                <div className="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
                    <div className="flex items-center gap-2 text-indigo-600">
                        <Volume2 className="w-6 h-6" />
                        <h1 className="text-xl font-bold tracking-tight">EchoFluent</h1>
                    </div>
                    <div className="text-sm text-slate-500 hidden sm:block">AI Assisted Speaking Practice</div>
                </div>
            </header>
        );

        // --- Component: Main App ---
        function App() {
            const [step, setStep] = useState('input');
            const [text, setText] = useState('');
            
            const [finalTranscript, setFinalTranscript] = useState('');
            const [interimTranscript, setInterimTranscript] = useState('');
            const [isRecording, setIsRecording] = useState(false);
            const [recognitionError, setRecognitionError] = useState('');

            const fullTranscriptRef = useRef(''); 

            const [isPlaying, setIsPlaying] = useState(false);
            const [playbackSpeed, setPlaybackSpeed] = useState(1.0);
            const [availableVoices, setAvailableVoices] = useState([]);
            const [selectedVoiceIndex, setSelectedVoiceIndex] = useState(0);
            
            const [score, setScore] = useState(0);
            const [wordMatches, setWordMatches] = useState([]);
            const [feedback, setFeedback] = useState('');

            const recognitionRef = useRef(null);
            const synthRef = useRef(window.speechSynthesis);

            useEffect(() => {
                const loadVoices = () => {
                    const voices = synthRef.current.getVoices();
                    const englishVoices = voices.filter(voice => voice.lang.includes('en'));
                    englishVoices.sort((a, b) => {
                        if (a.name.includes('Google') && !b.name.includes('Google')) return -1;
                        if (b.name.includes('Google') && !a.name.includes('Google')) return 1;
                        return 0;
                    });
                    setAvailableVoices(englishVoices);
                };
                loadVoices();
                if (synthRef.current.onvoiceschanged !== undefined) {
                    synthRef.current.onvoiceschanged = loadVoices;
                }
            }, []);

            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    const recognition = new SpeechRecognition();
                    recognition.continuous = true;
                    recognition.interimResults = true;
                    recognition.lang = 'en-US';

                    recognition.onresult = (event) => {
                        let final = '';
                        let interim = '';
                        for (let i = event.resultIndex; i < event.results.length; ++i) {
                            if (event.results[i].isFinal) {
                                final += event.results[i][0].transcript;
                            } else {
                                interim += event.results[i][0].transcript;
                            }
                        }
                        if (final) setFinalTranscript(prev => prev + " " + final);
                        setInterimTranscript(interim);
                    };

                    recognition.onerror = (event) => {
                        if (event.error === 'aborted') return;
                        console.error("Speech recognition error", event.error);
                        if (event.error === 'not-allowed') setRecognitionError('Microphone access denied.');
                    };

                    recognition.onend = () => {
                        setIsRecording(prev => {
                            if (prev) {
                                try { recognition.start(); return true; } catch(e) { return false; }
                            }
                            return false;
                        });
                    };
                    recognitionRef.current = recognition;
                } else {
                    setRecognitionError('Browser not supported (Use Chrome/Safari).');
                }
                return () => {
                    if (recognitionRef.current) recognitionRef.current.abort();
                    if (synthRef.current) synthRef.current.cancel();
                };
            }, []);

            useEffect(() => {
                fullTranscriptRef.current = (finalTranscript + " " + interimTranscript).trim();
            }, [finalTranscript, interimTranscript]);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => setText(e.target.result);
                    reader.readAsText(file);
                }
            };

            const startPractice = () => {
                if (!text.trim()) return;
                setFinalTranscript('');
                setInterimTranscript('');
                setScore(0);
                fullTranscriptRef.current = ''; 
                setStep('practice');
            };

            const togglePlayback = () => {
                if (isPlaying) {
                    synthRef.current.cancel();
                    setIsPlaying(false);
                } else {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US';
                    utterance.rate = playbackSpeed;
                    if (availableVoices.length > 0 && availableVoices[selectedVoiceIndex]) {
                        utterance.voice = availableVoices[selectedVoiceIndex];
                    }
                    utterance.onend = () => setIsPlaying(false);
                    synthRef.current.speak(utterance);
                    setIsPlaying(true);
                }
            };

            const toggleRecording = () => {
                if (!recognitionRef.current) return;
                if (isRecording) {
                    setIsRecording(false);
                    recognitionRef.current.stop();
                    finishPractice();
                } else {
                    setFinalTranscript('');
                    setInterimTranscript('');
                    fullTranscriptRef.current = '';
                    setRecognitionError('');
                    try {
                        recognitionRef.current.start();
                        setIsRecording(true);
                    } catch (e) { console.error(e); }
                }
            };

            const finishPractice = () => {
                setTimeout(() => {
                    const spokenText = fullTranscriptRef.current;
                    const { score: calculatedScore, matches } = calculateDetailedScore(text, spokenText);
                    setScore(calculatedScore);
                    setWordMatches(matches);
                    
                    if (calculatedScore >= 90) setFeedback("Fantastic! You're a natural!");
                    else if (calculatedScore >= 70) setFeedback("Great job! Keep up the good work.");
                    else if (calculatedScore >= 40) setFeedback("Good effort! I understood many words.");
                    else setFeedback("Don't worry! Try speaking a bit slower.");

                    setStep('result');
                }, 800);
            };

            const resetApp = () => {
                setStep('input');
                setText('');
                setFinalTranscript('');
                setInterimTranscript('');
                fullTranscriptRef.current = '';
                setScore(0);
                setRecognitionError('');
                setIsPlaying(false);
                synthRef.current.cancel();
                if (isRecording && recognitionRef.current) {
                    recognitionRef.current.stop();
                    setIsRecording(false);
                }
            };

            const retrySameText = () => {
                setStep('practice');
                setFinalTranscript('');
                setInterimTranscript('');
                fullTranscriptRef.current = '';
                setScore(0);
                setRecognitionError('');
                setIsRecording(false);
            };

            const renderInputStep = () => (
                <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <div className="bg-white rounded-2xl shadow-xl p-6 sm:p-8 border border-slate-100">
                        <h2 className="text-2xl font-bold text-slate-800 mb-4 flex items-center gap-2">
                            <FileText className="text-indigo-500" />
                            Step 1: Enter Text
                        </h2>
                        <div className="relative">
                            <textarea
                                className="w-full h-48 p-4 bg-slate-50 rounded-xl border-2 border-slate-200 focus:border-indigo-500 focus:ring-0 transition-colors resize-none text-slate-700 text-lg leading-relaxed placeholder:text-slate-300"
                                placeholder="Paste English text here..."
                                value={text}
                                onChange={(e) => setText(e.target.value)}
                            />
                            <div className="absolute bottom-4 right-4">
                                <label className="cursor-pointer bg-white text-slate-600 px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50 text-sm font-medium flex items-center gap-2 transition-colors shadow-sm">
                                    <Upload className="w-4 h-4" />
                                    Upload .txt
                                    <input type="file" accept=".txt" onChange={handleFileUpload} className="hidden" />
                                </label>
                            </div>
                        </div>
                        <div className="mt-6 flex justify-end">
                            <button
                                onClick={startPractice}
                                disabled={!text.trim()}
                                className="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed text-white px-8 py-3 rounded-xl font-bold text-lg shadow-lg shadow-indigo-200 transition-all flex items-center gap-2"
                            >
                                Start Practice <ChevronRight className="w-5 h-5" />
                            </button>
                        </div>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        {["Practice makes perfect.", "The quick brown fox jumps over the lazy dog."].map((sample, i) => (
                            <button key={i} onClick={() => setText(sample)} className="text-left p-4 bg-white rounded-xl border border-slate-200 hover:border-indigo-300 hover:shadow-md transition-all text-slate-600 text-sm italic">"{sample}"</button>
                        ))}
                    </div>
                </div>
            );

            const renderPracticeStep = () => (
                <div className="space-y-6 animate-in zoom-in-95 duration-300">
                    <div className="bg-white rounded-2xl shadow-lg border border-slate-100 overflow-hidden">
                        <div className="p-6 sm:p-8 bg-slate-50 border-b border-slate-100">
                            <p className="text-xl sm:text-2xl font-medium text-slate-800 leading-relaxed font-serif">{text}</p>
                        </div>
                        <div className="p-4 bg-white flex flex-col gap-4">
                            <div className="flex flex-col sm:flex-row items-center justify-between gap-4">
                                <div className="flex items-center gap-2 w-full sm:w-auto flex-1 min-w-0">
                                    <Settings className="w-4 h-4 text-slate-400" />
                                    <select 
                                        className="w-full sm:w-64 p-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none truncate"
                                        value={selectedVoiceIndex}
                                        onChange={(e) => setSelectedVoiceIndex(Number(e.target.value))}
                                    >
                                        {availableVoices.length === 0 && <option>Loading voices...</option>}
                                        {availableVoices.map((voice, index) => (
                                            <option key={index} value={index}>{voice.name} ({voice.lang})</option>
                                        ))}
                                    </select>
                                </div>
                                <div className="flex items-center gap-3 bg-slate-100 rounded-full px-4 py-2 w-full sm:w-auto">
                                    <span className="text-xs font-bold text-slate-500 uppercase">Speed</span>
                                    <input
                                        type="range"
                                        min="0.5"
                                        max="2.0"
                                        step="0.1"
                                        value={playbackSpeed}
                                        onChange={(e) => setPlaybackSpeed(parseFloat(e.target.value))}
                                        className="w-24 sm:w-32 accent-indigo-600 cursor-pointer"
                                    />
                                    <span className="text-sm font-mono text-indigo-600 w-8 text-right">{playbackSpeed}x</span>
                                </div>
                            </div>
                            <div className="flex justify-center sm:justify-end">
                                <button
                                    onClick={togglePlayback}
                                    className={`w-full sm:w-auto flex items-center justify-center gap-2 px-6 py-2.5 rounded-full font-bold transition-all ${
                                        isPlaying 
                                        ? 'bg-amber-100 text-amber-700 hover:bg-amber-200' 
                                        : 'bg-indigo-100 text-indigo-700 hover:bg-indigo-200'
                                    }`}
                                >
                                    {isPlaying ? <Square className="w-4 h-4 fill-current" /> : <Play className="w-4 h-4 fill-current" />}
                                    {isPlaying ? 'Stop Audio' : 'Listen Model'}
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-xl p-8 text-center border-2 border-indigo-50 relative overflow-hidden">
                        {isRecording && (
                            <div className="absolute inset-0 bg-indigo-50/30 flex items-center justify-center pointer-events-none">
                                <div className="animate-ping absolute w-40 h-40 rounded-full bg-indigo-400 opacity-20"></div>
                            </div>
                        )}
                        <div className="relative z-10 flex flex-col items-center gap-6">
                            <div className="space-y-2">
                                <h3 className="text-lg font-bold text-slate-700">
                                    {isRecording ? "Listening..." : "Ready to Record"}
                                </h3>
                                <p className="text-slate-500 text-sm">
                                    {isRecording ? "Read text. Press stop to finish." : "Tap microphone to start."}
                                </p>
                            </div>
                            <button
                                onClick={toggleRecording}
                                className={`w-24 h-24 rounded-full flex items-center justify-center transition-all duration-300 shadow-xl ${
                                    isRecording
                                    ? 'bg-red-500 hover:bg-red-600 scale-110 ring-4 ring-red-200 animate-pulse'
                                    : 'bg-indigo-600 hover:bg-indigo-700 hover:scale-105'
                                }`}
                            >
                                {isRecording ? <Square className="w-10 h-10 text-white fill-current" /> : <Mic className="w-10 h-10 text-white" />}
                            </button>
                            {recognitionError && (
                                <div className="text-red-500 text-sm bg-red-50 px-3 py-1 rounded-full flex items-center gap-1">
                                    <X className="w-3 h-3" /> {recognitionError}
                                </div>
                            )}
                            <div className="w-full min-h-[3rem] flex items-center justify-center px-4 bg-slate-50 rounded-lg border border-slate-100">
                                <p className="text-slate-600 text-lg break-words">
                                    {finalTranscript} <span className="text-indigo-400">{interimTranscript}</span>
                                    {!finalTranscript && !interimTranscript && isRecording && <span className="text-slate-400 italic">...</span>}
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );

            const renderResultStep = () => {
                const isHighScore = score >= 80;
                return (
                <div className="space-y-6 animate-in zoom-in-95 duration-500 relative">
                    {isHighScore && (
                        <div className="absolute inset-0 pointer-events-none overflow-hidden -z-10">
                            <div className="absolute top-0 left-1/4 w-2 h-2 bg-red-400 rounded-full animate-bounce delay-100"></div>
                            <div className="absolute top-10 right-1/4 w-3 h-3 bg-blue-400 rounded-full animate-pulse delay-200"></div>
                        </div>
                    )}
                    <div className="bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100">
                        <div className={`p-8 text-center text-white relative overflow-hidden ${isHighScore ? 'bg-gradient-to-br from-indigo-500 to-purple-600' : 'bg-gradient-to-br from-blue-400 to-indigo-500'}`}>
                            {isHighScore && <Star className="absolute top-4 right-4 w-8 h-8 text-yellow-300 animate-spin-slow opacity-50" />}
                            <Award className="w-12 h-12 mx-auto mb-2 opacity-80" />
                            <h2 className="text-lg font-medium opacity-90 mb-1">Your Score</h2>
                            <div className="text-8xl font-black tracking-tighter mb-2 drop-shadow-md">
                                {score}<span className="text-3xl opacity-60 font-normal">/100</span>
                            </div>
                            <p className="text-xl font-bold opacity-100">{feedback}</p>
                        </div>

                        <div className="p-8">
                            <h3 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                                <Check className="w-4 h-4" /> Analysis
                            </h3>
                            <div className="space-y-4">
                                <div className="p-6 bg-slate-50 rounded-xl border border-slate-200">
                                    <p className="text-xl leading-relaxed text-slate-400 font-serif">
                                        {text.split(/\s+/).map((word, i) => {
                                            const isMatch = wordMatches[i];
                                            return (
                                                <span key={i} className={`inline-block mr-1.5 transition-all duration-500 ${isMatch ? 'text-indigo-600 font-bold scale-110 origin-bottom' : 'opacity-60'}`}>
                                                    {word}{isMatch && <span className="absolute -top-1 -right-1 w-1.5 h-1.5 bg-green-400 rounded-full"></span>}
                                                </span>
                                            );
                                        })}
                                    </p>
                                </div>
                                <div className="p-4 bg-white rounded-xl border border-slate-100 text-sm">
                                    <span className="text-xs font-bold text-slate-400 block mb-1">AI Heard:</span>
                                    <p className="text-slate-600 italic">"{fullTranscriptRef.current || (finalTranscript + " " + interimTranscript)}"</p>
                                </div>
                            </div>
                        </div>

                        <div className="p-6 bg-slate-50 border-t border-slate-100 flex flex-col sm:flex-row gap-3 justify-center">
                            <button onClick={retrySameText} className="flex-1 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 px-6 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-colors shadow-sm">
                                <RotateCcw className="w-4 h-4" /> Try Again
                            </button>
                            <button onClick={resetApp} className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-colors shadow-lg shadow-indigo-200">
                                <FileText className="w-4 h-4" /> New Text
                            </button>
                        </div>
                    </div>
                </div>
                );
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-900 font-sans selection:bg-indigo-100 selection:text-indigo-800 pb-12">
                    <Header />
                    <main className="max-w-2xl mx-auto px-4 py-8">
                        {step === 'input' && renderInputStep()}
                        {step === 'practice' && renderPracticeStep()}
                        {step === 'result' && renderResultStep()}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
